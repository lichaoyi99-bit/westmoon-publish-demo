/* V1.1.0：按 WDS v2.0 统一 Westmoon 视觉层；仅调整颜色、尺寸、圆角、阴影与间距，不改变业务逻辑。 */
:root{
  --wds-bg:#f5f5f5;
  --wds-action:#6424fe;
  --wds-action-hover:#7357ff;
  --wds-action-muted:#f6f5ff;
  --wds-surface:#fff;
  --wds-border:#e5e6eb;
  --wds-control-border:#d9d9d9;
  --wds-text:#1d2129;
  --wds-text-muted:#4e5969;
  --wds-text-subtle:#86909c;
  --wds-text-disabled:#c9cdd4;
  --wds-control-h:32px;
  --wds-radius-control:6px;
}
body{background:var(--wds-bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--wds-text)}
.card{border-color:var(--wds-border);border-radius:8px;box-shadow:none}
.shop,.order{border-radius:8px}
.shop-head,.order-head{border-color:var(--wds-border)}
input[type=checkbox]{accent-color:var(--wds-action)}
.btn.orange{background:var(--wds-action);border-color:var(--wds-action);color:#fff}
.btn.orange:hover{background:var(--wds-action-hover);border-color:var(--wds-action-hover);color:#fff}
.right{background:var(--wds-surface)}
.section h2,.right h2{font-weight:600}
.shop-head b{font-weight:600}
.stage button,.modebar button{font-weight:500}
.sub,.muted{color:var(--wds-text-muted)}
.mini,.sku,.delivery span{color:var(--wds-text-subtle)}
.stage{gap:8px;min-width:0}
.stage button{height:36px;min-height:36px;padding:0 14px;border-radius:var(--wds-radius-control);font-size:14px;font-weight:500;white-space:nowrap;word-break:keep-all;box-shadow:none}
.stage button.active{background:var(--wds-action-muted);border-color:#b9adff;color:var(--wds-action)}
.btn{height:var(--wds-control-h);min-height:var(--wds-control-h);padding:0 12px;border:1px solid var(--wds-control-border);border-radius:var(--wds-radius-control);font-size:14px;line-height:30px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;word-break:keep-all;box-shadow:none}
.btn:hover{border-color:var(--wds-action);color:var(--wds-action)}
.btn.primary{background:var(--wds-action);border-color:var(--wds-action);color:#fff}
.btn.primary:hover{background:var(--wds-action-hover);border-color:var(--wds-action-hover);color:#fff}
.btn:disabled{opacity:1;color:var(--wds-text-disabled);background:#f7f8fa;border-color:var(--wds-border);cursor:not-allowed}
.product{grid-template-columns:24px 64px minmax(260px,1fr) 145px 100px 120px 100px minmax(104px,auto)}
.product .actions{min-width:104px;justify-content:flex-start;align-items:center;flex-wrap:nowrap}
.product .actions .btn{min-width:64px}
.product>div:last-child{min-width:104px;display:flex;align-items:center;justify-content:flex-start;white-space:nowrap}
.qty button,.qty span{height:var(--wds-control-h);width:var(--wds-control-h);border-color:var(--wds-control-border);box-shadow:none}
.qty button:first-child{border-radius:var(--wds-radius-control) 0 0 var(--wds-radius-control)}
.qty button:last-child{border-radius:0 var(--wds-radius-control) var(--wds-radius-control) 0}
.field{height:var(--wds-control-h);border-color:var(--wds-control-border);border-radius:var(--wds-radius-control);padding:0 10px}
.modebar{gap:8px}
.modebar button{height:var(--wds-control-h);padding:0 12px;border-color:var(--wds-control-border);border-radius:var(--wds-radius-control);font-size:14px;white-space:nowrap;word-break:keep-all;box-shadow:none}
.modebar button.active{background:var(--wds-action-muted);border-color:#a99aff;color:var(--wds-action)}
.formfield input,.formfield textarea{border-color:var(--wds-control-border);border-radius:var(--wds-radius-control);box-shadow:none}
.formfield input{height:var(--wds-control-h)}
.shop-head .tag{border-radius:4px}
.notice{border-radius:6px}
.notice{position:relative;min-height:58px;padding-right:150px;font-size:14px;line-height:1.5}
.notice b{font-size:15px;font-weight:600}
.notice>.btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);float:none!important;height:32px;padding:0 12px!important}
.fieldrow{grid-template-columns:minmax(96px,120px) minmax(0,1fr)}
.fieldrow .field{min-width:0;width:100%}
@media(max-width:1100px){
  .layout{grid-template-columns:minmax(0,1fr) 320px}
  .fieldrow{grid-template-columns:96px minmax(0,1fr)}
}
@media(max-width:950px){
  .product{position:relative;grid-template-columns:24px 55px minmax(0,1fr);padding-right:100px}
  .product>div:last-child{position:absolute;right:12px;top:16px;min-width:64px;justify-content:flex-start;flex-wrap:nowrap}
  .product .actions .btn{min-width:64px}
  .fieldrow{grid-template-columns:1fr;gap:6px}
  .fieldrow label{font-size:14px}
  .notice{padding-right:130px}
}
</style>

ontent:flex-end;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)"><button class="btn" onclick="go('orders')">取消</button><button class="btn primary" onclick="submitInvoice()">提交开票申请</button></div></section><aside class="card right"><h2>开票汇总</h2><div class="sum"><span>订单数量</span><b>${selected.length}</b></div><div class="sum"><span>商品金额</span><b>${money(total)}</b></div><div class="sum"><span>税费</span><b>${money(total*.06)}</b></div><div class="sum total"><span>合计（含税）</span><b class="purple">${money(total)}</b></div><p class="mini">发票生成后将发送至填写的接收邮箱，并可在发票详情页下载。</p></aside></div>`;app.innerHTML=flowNav('invoice')+page('开票申请','单笔与批量订单使用同一套开票页面。',body)}

function go(r){route=r;render();window.scrollTo(0,0)}function setMode(m){mode=m;render()}function toggleAll(on){items.forEach(p=>on?selected.add(p.id):selected.delete(p.id));render()}function toggleItem(id,on){on?selected.add(id):selected.delete(id);render()}function changeQty(id,d){let p=items.find(x=>x.id===id);p.qty=Math.max(1,p.qty+d);render()}function pickOrder(no,on){on?pickedOrders.add(no):pickedOrders.delete(no);render()}function openBatchApply(){if(!pickedOrders.size)return toast('请先选择可开票订单');selectedInvoiceOrders=[...pickedOrders];go('apply')}function openApplyFor(no){selectedInvoiceOrders=[no];go('apply')}function openDetail(no){window.detailNo=no;go('detail')}function submitOrder(){toast('订单已创建，正在进入我的订单');setTimeout(()=>go('orders'),500)}function submitInvoice(){toast('开票申请已提交，状态：开票中');setTimeout(()=>{selectedInvoiceOrders.forEach(no=>{let o=orderByNo(no);if(o)o.invoice='processing'});go('orders')},500)}function download(type){toast(`正在下载 ${type} 格式发票`)}function openBind(){openModal('绑定第三方店铺',`<div class="notice">授权后可自动同步平台订单和物流信息。</div><div class="formgrid"><div class="formfield full"><label>销售平台</label><div class="field select">请选择平台</div></div><div class="formfield full"><label>店铺名称</label><input placeholder="自定义店铺名称，便于区分"></div><div class="formfield full"><label>授权 Token</label><input placeholder="请输入授权 Token"></div><div class="formfield"><label>店铺币种</label><div class="field select">请选择</div></div><div class="formfield"><label>店铺负责人</label><div class="field">李超艺</div></div></div><div style="display:flex;justify-content:flex-end;gap:10px;margin-top:22px"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="closeModal();toast('店铺授权成功，已回填结算页')">授权</button></div>`)}function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('open');document.getElementById('modalMask').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open');document.getElementById('modalMask').classList.remove('open')}function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('drawerMask').classList.remove('open')}function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
